<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Random Glitchy Button v2.1</title>
<style>
:root {
--bg-color: #121212;
--container-bg: #1a1a1a;
--primary-red: #cc0000;
--neon-red: #ff3333;
--dark-red: #660000;
--text-main: #ffffff;
--text-muted: #aaa;
}

body {
font-family: 'Courier New', Courier, monospace;
background-color: var(--bg-color);
color: var(--text-main);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
overflow-x: hidden;
padding: 20px;
box-sizing: border-box;
transition: background-color 0.05s ease;
}

.blink-red {
background-color: #ff0000 !important;
}

.container {
text-align: center;
padding: 30px 20px;
border: 2px dashed #444;
border-radius: 15px;
background: var(--container-bg);
box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
max-width: 450px;
width: 100%;
box-sizing: border-box;
}

h1 {
color: var(--neon-red);
margin-top: 0;
font-size: 1.8rem;
letter-spacing: 1px;
}

p {
font-size: 0.9rem;
color: var(--text-muted);
margin-bottom: 20px;
}

.counter-box {
background-color: #000;
padding: 15px;
border-radius: 8px;
border: 1px solid #333;
margin: 20px 0;
}

.counter {
font-size: 4.5rem;
font-weight: bold;
color: var(--neon-red);
text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
line-height: 1;
margin-bottom: 5px;
}

.metrics-grid {
display: flex;
justify-content: space-around;
font-size: 0.8rem;
color: #666;
border-top: 1px dashed #222;
padding-top: 8px;
margin-top: 5px;
}

.metric-val {
color: #888;
font-weight: bold;
}

.btn-wrapper {
margin: 35px 0;
}

.btn {
padding: 20px 40px;
font-size: 1.5rem;
font-weight: bold;
background-color: var(--primary-red);
color: white;
border: 2px solid var(--neon-red);
border-radius: 10px;
cursor: pointer;
outline: none;
position: relative;
box-shadow: 0 8px 0 var(--dark-red);
transition: transform 0.05s ease, box-shadow 0.05s ease;
text-transform: uppercase;
width: 100%;
max-width: 280px;
user-select: none;
-webkit-user-select: none;
}

/* Instant visual feedback - works for both mouse and keyboard */
.btn:active, .btn.visual-active {
transform: translateY(4px);
box-shadow: 0 4px 0 var(--dark-red);
}

.btn.pressed {
box-shadow: 0 0px 0 var(--dark-red) !important;
transform: translateY(8px) !important;
}

.btn:focus-visible {
outline: 2px solid #fff;
outline-offset: 4px;
}

.status {
margin-top: 25px;
font-size: 1rem;
min-height: 48px;
color: var(--text-muted);
line-height: 1.4;
word-wrap: break-word;
overflow-wrap: break-word;
padding: 0 10px;
}

/* Screen reader only - hidden visually but announced */
.sr-only {
position: absolute;
width: 1px;
height: 1px;
padding: 0;
margin: -1px;
overflow: hidden;
clip: rect(0, 0, 0, 0);
white-space: nowrap;
border: 0;
}
</style>
</head>
<body>

<div class="container">
<h1>The Random Glitchy Button</h1>
<p>The system registers input randomly. Counter resets arbitrarily between 10 and 1,000 counts.</p>

<div class="counter-box">
<div class="counter" id="clickCount">0</div>
<div class="metrics-grid">
<div>ATTEMPTS: <span id="totalAttempts" class="metric-val">0</span></div>
<div>ACCURACY: <span id="successRate" class="metric-val">0%</span></div>
</div>
</div>

<div class="btn-wrapper">
<button class="btn" id="clickBtn" aria-describedby="statusMsg">Try to Press</button>
</div>

<!-- ARIA live region for screen reader announcements -->
<div class="status" id="statusMsg" role="status" aria-live="polite">
Interact via mouse click, touch, or Space/Enter keys to begin...
</div>

<!-- Hidden live region for critical alerts -->
<div class="sr-only" role="alert" aria-live="assertive" id="alertMsg"></div>
</div>

<script>
let successCount = 0;
let totalAttempts = 0;

const bodyEl = document.body;
const clickBtn = document.getElementById('clickBtn');
const clickCount = document.getElementById('clickCount');
const totalAttemptsEl = document.getElementById('totalAttempts');
const successRateEl = document.getElementById('successRate');
const statusMsg = document.getElementById('statusMsg');
const alertMsg = document.getElementById('alertMsg');

function handleInteraction() {
totalAttempts++;

const isButtonActuallyPressed = Math.random() < 0.3;

if (isButtonActuallyPressed) {
successCount++;
clickCount.textContent = successCount;

clickBtn.classList.add('pressed');
bodyEl.classList.add('blink-red');

const message = `Click registered! Red LED indicator blinked. Attempt ${totalAttempts}. Success count: ${successCount}.`;
statusMsg.textContent = `🎉 ${message}`;

setTimeout(() => {
bodyEl.classList.remove('blink-red');
clickBtn.classList.remove('pressed');
}, 80);

} else {
const message = `Button is jammed! It did not register. Try again. Attempt ${totalAttempts}.`;
statusMsg.textContent = `❌ ${message}`;
}

const currentRate = ((successCount / totalAttempts) * 100).toFixed(1);
successRateEl.textContent = `${currentRate}%`;
totalAttemptsEl.textContent = totalAttempts;

// Better reset probability (10% multiplier instead of 5%)
if (successCount >= 10) {
const resetProbability = (successCount - 10) / 990;

if (successCount >= 1000 || Math.random() < resetProbability * 0.1) {
const resetMessage = `System limit triggered! Counter has automatically reset to 0. Total attempts: ${totalAttempts}.`;
statusMsg.textContent = `🚨 ${resetMessage}`;

// Announce reset to screen readers via alert region
alertMsg.textContent = resetMessage;

successCount = 0;
totalAttempts = 0;

setTimeout(() => {
clickCount.textContent = successCount;
totalAttemptsEl.textContent = 0;
successRateEl.textContent = "0%";
alertMsg.textContent = "";
}, 120);
}
}
}

// Pointer Event binding (Mouse & Touch)
clickBtn.addEventListener('click', () => {
handleInteraction();
});

// Keyboard Event bindings
window.addEventListener('keydown', (e) => {
if ((e.key === ' ' || e.key === 'Enter') && document.activeElement === clickBtn) {
// Prevent spacebar tracking from scrolling the web view page down
if (e.key === ' ') e.preventDefault();
clickBtn.classList.add('visual-active');
}
});

window.addEventListener('keyup', (e) => {
if ((e.key === ' ' || e.key === 'Enter') && document.activeElement === clickBtn) {
clickBtn.classList.remove('visual-active');
handleInteraction();
}
});
</script>

</body>
</html>
