<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sisyphus.io // Absolute Focus Challenge</title>

    <style>
        /* =========================================================
           SISYPHUS.IO
           Human-readable single-file game
           ========================================================= */

        :root {
            --bg: #050807;
            --panel: rgba(8, 16, 13, 0.92);
            --panel-light: rgba(15, 28, 22, 0.95);

            --green: #00ff88;
            --green-soft: #52ffb0;

            --red: #ff3158;
            --blue: #00c8ff;
            --purple: #b44cff;
            --yellow: #ffe600;
            --orange: #ff8a00;
            --pink: #ff4fd8;

            --text: #e8fff4;
            --muted: #71877d;
            --border: rgba(0, 255, 136, 0.18);

            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0, 255, 136, 0.08),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* =========================================================
           BACKGROUND
           ========================================================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(0, 255, 136, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 255, 136, 0.025) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;
            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 90%
            );
        }

        #particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .background-particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: var(--green);

            opacity: 0;

            animation: floatParticle 8s linear forwards;
        }

        @keyframes floatParticle {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.5);
            }

            15% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1.4);
            }
        }

        /* =========================================================
           MAIN APP
           ========================================================= */

        .app {
            width: min(100%, 520px);
            min-height: 650px;

            position: relative;
            z-index: 5;

            border: 1px solid var(--border);
            border-radius: var(--radius);

            background: var(--panel);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            overflow: hidden;
        }

        /* =========================================================
           TOP BAR
           ========================================================= */

        .top-bar {
            height: 54px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            border-bottom: 1px solid var(--border);

            color: var(--muted);
            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }

        .brand {
            color: var(--green);
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px var(--green);

            animation: statusPulse 1.6s infinite;
        }

        @keyframes statusPulse {
            50% {
                opacity: 0.35;
                transform: scale(0.75);
            }
        }

        /* =========================================================
           SCREENS
           ========================================================= */

        .screen {
            display: none;
            min-height: 596px;
            padding: 25px;
        }

        .screen.active {
            display: block;
            animation: screenIn 0.35s ease;
        }

        @keyframes screenIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           AUTH SCREEN
           ========================================================= */

        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-content {
            width: 100%;
            text-align: center;
        }

        .terminal-icon {
            width: 76px;
            height: 76px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 50%;

            color: var(--green);
            font-size: 30px;

            box-shadow:
                0 0 30px rgba(0, 255, 136, 0.08),
                inset 0 0 25px rgba(0, 255, 136, 0.05);
        }

        .auth-title {
            font-size: clamp(28px, 8vw, 42px);
            line-height: 1;

            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .auth-title span {
            color: var(--green);
        }

        .auth-description {
            max-width: 390px;
            margin: 0 auto 28px;

            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .input-label {
            display: block;
            margin-bottom: 7px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .name-input {
            width: 100%;

            padding: 15px;

            border: 1px solid var(--border);
            border-radius: 12px;

            outline: none;

            background: rgba(0, 0, 0, 0.25);

            color: var(--text);

            font: inherit;
        }

        .name-input:focus {
            border-color: var(--green);

            box-shadow:
                0 0 0 3px rgba(0, 255, 136, 0.08);
        }

        .primary-button {
            width: 100%;

            margin-top: 5px;
            padding: 16px;

            border: 1px solid var(--green);
            border-radius: 12px;

            background: rgba(0, 255, 136, 0.08);

            color: var(--green);

            font: inherit;
            font-size: 13px;
            font-weight: 900;

            letter-spacing: 1.2px;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .primary-button:hover {
            background: rgba(0, 255, 136, 0.15);

            box-shadow:
                0 0 25px rgba(0, 255, 136, 0.12);
        }

        .primary-button:active {
            transform: scale(0.97);
        }

        /* =========================================================
           GAME HEADER
           ========================================================= */

        .game-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;
        }

        .stage-label {
            color: var(--green);

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        .game-title {
            margin-top: 5px;

            font-size: 24px;
            font-weight: 900;
        }

        .best-score {
            color: var(--muted);
            font-size: 10px;
            text-align: right;
        }

        .best-score strong {
            display: block;

            margin-top: 3px;

            color: var(--yellow);
            font-size: 15px;
        }

        /* =========================================================
           SCORE
           ========================================================= */

        .score-card {
            padding: 20px;

            border: 1px solid var(--border);
            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    rgba(0, 255, 136, 0.055),
                    rgba(0, 0, 0, 0.12)
                );

            text-align: center;
        }

        .score-caption {
            color: var(--muted);

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 2px;
        }

        .score {
            margin: 4px 0;

            color: var(--green);

            font-family: monospace;
            font-size: clamp(54px, 16vw, 82px);
            font-weight: 900;

            line-height: 1;

            text-shadow:
                0 0 20px rgba(0, 255, 136, 0.18);

            transition:
                transform 0.12s ease,
                color 0.12s ease;
        }

        .score.bump {
            animation: scoreBump 0.25s ease;
        }

        @keyframes scoreBump {
            50% {
                transform: scale(1.14);
            }
        }

        .score.flash {
            animation: scoreFlash 0.3s ease;
        }

        @keyframes scoreFlash {
            50% {
                color: white;
                transform: scale(1.18);
            }
        }

        /* =========================================================
           PROGRESS
           ========================================================= */

        .progress-area {
            margin: 18px 0;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 7px;

            color: var(--muted);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-track {
            height: 7px;

            overflow: hidden;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.06);
        }

        .progress-fill {
            width: 0;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--green),
                    var(--blue),
                    var(--purple)
                );

            box-shadow:
                0 0 15px rgba(0, 255, 136, 0.35);

            transition: width 0.25s ease;
        }

        /* =========================================================
           STATS
           ========================================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 10px;

            margin-bottom: 18px;
        }

        .stat {
            padding: 12px;

            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.015);
        }

        .stat-label {
            color: var(--muted);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 3px;

            color: white;

            font-family: monospace;
            font-size: 18px;
            font-weight: 900;
        }

        .combo-value {
            color: var(--yellow);
        }

        /* =========================================================
           DANGER BUTTON
           ========================================================= */

        .danger-zone {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 210px;

            margin: 10px 0 15px;

            overflow: hidden;

            border: 1px dashed rgba(255, 49, 88, 0.2);
            border-radius: 18px;
        }

        .danger-button {
            position: relative;

            width: 150px;
            height: 150px;

            border: 2px solid var(--green);
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 255, 136, 0.13),
                    rgba(0, 0, 0, 0.1) 65%
                );

            color: var(--green);

            font-size: 13px;
            font-weight: 1000;

            letter-spacing: 1px;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;

            overflow: hidden;

            box-shadow:
                0 0 0 rgba(0, 255, 136, 0),
                inset 0 0 25px rgba(0, 255, 136, 0.04);

            transition:
                transform 0.12s ease,
                border-color 0.12s ease,
                box-shadow 0.12s ease;
        }

        .danger-button::before {
            content: "";

            position: absolute;
            inset: 10px;

            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 50%;

            animation: buttonRotate 10s linear infinite;
        }

        @keyframes buttonRotate {
            to {
                transform: rotate(360deg);
            }
        }

        .danger-button:hover {
            box-shadow:
                0 0 35px rgba(0, 255, 136, 0.18),
                inset 0 0 30px rgba(0, 255, 136, 0.08);
        }

        .danger-button:active {
            transform: scale(0.91);
        }

        .danger-button.disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        /* =========================================================
           RIPPLE
           ========================================================= */

        .ripple {
            position: absolute;

            width: 10px;
            height: 10px;

            margin-left: -5px;
            margin-top: -5px;

            border-radius: 50%;

            background: currentColor;

            pointer-events: none;

            transform: scale(0);

            opacity: 0.75;

            animation: rippleEffect 0.65s ease-out forwards;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(16);
                opacity: 0;
            }
        }

        /* =========================================================
           GAME EFFECTS
           ========================================================= */

        .effect-particle {
            position: fixed;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 100;

            box-shadow:
                0 0 12px currentColor;

            animation:
                explodeParticle var(--duration) ease-out forwards;
        }

        @keyframes explodeParticle {
            0% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            70% {
                opacity: 0.9;
            }

            100% {
                opacity: 0;

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(0);
            }
        }

        .effect-ring {
            position: fixed;

            width: 30px;
            height: 30px;

            margin-left: -15px;
            margin-top: -15px;

            border: 3px solid currentColor;
            border-radius: 50%;

            pointer-events: none;

            z-index: 90;

            animation: ringExpand 0.7s ease-out forwards;
        }

        @keyframes ringExpand {
            to {
                width: 300px;
                height: 300px;

                margin-left: -150px;
                margin-top: -150px;

                opacity: 0;
            }
        }

        .combo-star {
            position: fixed;

            pointer-events: none;

            z-index: 110;

            font-size: 18px;

            color: var(--yellow);

            text-shadow:
                0 0 10px currentColor;

            animation:
                starFly 0.9s ease-out forwards;
        }

        @keyframes starFly {
            0% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(0.5)
                    rotate(0);
            }

            100% {
                opacity: 0;

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1.4)
                    rotate(360deg);
            }
        }

        /* =========================================================
           FULL SCREEN EFFECTS
           ========================================================= */

        .screen-flash {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 80;

            opacity: 0;

            animation: screenFlash 0.45s ease-out forwards;
        }

        .screen-flash.green {
            background: rgba(0, 255, 136, 0.13);
        }

        .screen-flash.blue {
            background: rgba(0, 200, 255, 0.13);
        }

        .screen-flash.purple {
            background: rgba(180, 76, 255, 0.14);
        }

        .screen-flash.yellow {
            background: rgba(255, 230, 0, 0.14);
        }

        .screen-flash.red {
            background: rgba(255, 49, 88, 0.22);
        }

        @keyframes screenFlash {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .shake {
            animation: screenShake 0.4s ease;
        }

        @keyframes screenShake {
            0%,
            100% {
                transform: translateX(0);
            }

            15% {
                transform: translateX(-8px);
            }

            30% {
                transform: translateX(8px);
            }

            45% {
                transform: translateX(-7px);
            }

            60% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-4px);
            }

            90% {
                transform: translateX(4px);
            }
        }

        /* =========================================================
           FEEDBACK
           ========================================================= */

        .feedback {
            min-height: 25px;

            margin-bottom: 10px;

            text-align: center;

            color: var(--muted);

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .feedback.success {
            color: var(--green);
        }

        .feedback.warning {
            color: var(--yellow);
        }

        .feedback.danger {
            color: var(--red);
        }

        /* =========================================================
           CONTROLS
           ========================================================= */

        .controls {
            display: flex;
            justify-content: center;
            gap: 8px;

            flex-wrap: wrap;
        }

        .control-button {
            padding: 9px 12px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9px;

            background: rgba(255, 255, 255, 0.025);

            color: var(--muted);

            font-size: 10px;
            font-weight: 800;

            cursor: pointer;
        }

        .control-button:hover {
            border-color: var(--border);
            color: white;
        }

        /* =========================================================
           STAGE BANNER
           ========================================================= */

        .stage-banner {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;

            z-index: 200;

            opacity: 0;
        }

        .stage-banner.show {
            animation: bannerShow 1.7s ease forwards;
        }

        .stage-banner-content {
            text-align: center;

            padding: 30px;
        }

        .stage-banner-small {
            color: var(--green);

            font-size: 11px;
            font-weight: 900;

            letter-spacing: 4px;
        }

        .stage-banner-title {
            margin-top: 8px;

            color: white;

            font-size: clamp(30px, 10vw, 60px);
            font-weight: 1000;

            text-shadow:
                0 0 30px currentColor;
        }

        @keyframes bannerShow {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            20% {
                opacity: 1;
                transform: scale(1);
            }

            75% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: scale(1.08);
            }
        }

        /* =========================================================
           FINAL CELEBRATION
           ========================================================= */

        .celebration {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 300;

            overflow: hidden;
        }

        .celebration-piece {
            position: absolute;

            width: 10px;
            height: 18px;

            top: -30px;

            animation:
                celebrationFall var(--fall-time) linear forwards;
        }

        @keyframes celebrationFall {
            0% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(900deg);
            }
        }

        /* =========================================================
           FOCUS STATES
           ========================================================= */

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .app {
                width: 100%;
                min-height: 100vh;

                border: 0;
                border-radius: 0;
            }

            .screen {
                min-height: calc(100vh - 54px);

                padding: 20px;
            }

            .danger-zone {
                min-height: 190px;
            }

            .danger-button {
                width: 135px;
                height: 135px;
            }

            .score-card {
                padding: 16px;
            }
        }

        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         BACKGROUND PARTICLES
         ========================================================= -->

    <div id="particles"></div>

    <!-- =========================================================
         APPLICATION
         ========================================================= -->

    <main class="app" id="app">

        <!-- TOP BAR -->

        <header class="top-bar">
            <div class="brand">
                SISYPHUS.IO
            </div>

            <div class="online-status">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>
        </header>


        <!-- =====================================================
             LOGIN / START SCREEN
             ===================================================== -->

        <section
            class="screen auth-screen active"
            id="authScreen"
        >
            <div class="auth-content">

                <div class="terminal-icon">
                    ◉
                </div>

                <h1 class="auth-title">
                    ABSOLUTE <span>FOCUS</span>
                </h1>

                <p class="auth-description">
                    A simple test of patience, timing and persistence.
                    Press the button. Keep going. The system gets harder.
                </p>

                <div class="input-group">

                    <label
                        class="input-label"
                        for="playerName"
                    >
                        Operator name
                    </label>

                    <input
                        id="playerName"
                        class="name-input"
                        type="text"
                        maxlength="24"
                        autocomplete="off"
                        placeholder="Enter your name..."
                    >

                </div>

                <button
                    class="primary-button"
                    id="startButton"
                    type="button"
                >
                    INITIALIZE MISSION
                </button>

            </div>
        </section>


        <!-- =====================================================
             GAME SCREEN
             ===================================================== -->

        <section
            class="screen"
            id="gameScreen"
        >

            <!-- GAME HEADER -->

            <div class="game-header">

                <div>
                    <div
                        class="stage-label"
                        id="stageLabel"
                    >
                        STAGE 01
                    </div>

                    <div
                        class="game-title"
                        id="gameTitle"
                    >
                        TALLY ZONE
                    </div>
                </div>

                <div class="best-score">
                    BEST

                    <strong id="bestScore">
                        0
                    </strong>
                </div>

            </div>


            <!-- SCORE -->

            <div class="score-card">

                <div class="score-caption">
                    CURRENT TALLY
                </div>

                <div
                    class="score"
                    id="score"
                >
                    0
                </div>

            </div>


            <!-- PROGRESS -->

            <div class="progress-area">

                <div class="progress-top">

                    <span>
                        STAGE PROGRESS
                    </span>

                    <span id="progressText">
                        0%
                    </span>

                </div>

                <div class="progress-track">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>

            </div>


            <!-- STATS -->

            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        Combo
                    </div>

                    <div
                        class="stat-value combo-value"
                        id="combo"
                    >
                        0×
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-label">
                        Failures
                    </div>

                    <div
                        class="stat-value"
                        id="failures"
                    >
                        0
                    </div>

                </div>

            </div>


            <!-- DANGER BUTTON -->

            <div
                class="danger-zone"
                id="dangerZone"
            >

                <button
                    id="dangerButton"
                    class="danger-button"
                    type="button"
                    aria-label="Press the challenge button"
                >
                    PRESS
                </button>

            </div>


            <!-- FEEDBACK -->

            <div
                class="feedback"
                id="feedback"
            >
                Stay focused.
            </div>


            <!-- CONTROLS -->

            <div class="controls">

                <button
                    class="control-button"
                    id="soundButton"
                    type="button"
                >
                    🔊 SOUND ON
                </button>

                <button
                    class="control-button"
                    id="vibrationButton"
                    type="button"
                >
                    📳 VIBRATION ON
                </button>

                <button
                    class="control-button"
                    id="restartButton"
                    type="button"
                >
                    ↻ RESTART
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================================
         STAGE BANNER
         ========================================================= -->

    <div
        class="stage-banner"
        id="stageBanner"
    >

        <div class="stage-banner-content">

            <div
                class="stage-banner-small"
                id="bannerSmall"
            >
                STAGE COMPLETE
            </div>

            <div
                class="stage-banner-title"
                id="bannerTitle"
            >
                STAGE 02
            </div>

        </div>

    </div>


    <!-- FINAL CELEBRATION -->

    <div
        class="celebration"
        id="celebration"
    ></div>


    <script>
        /* =========================================================
           SISYPHUS.IO GAME ENGINE
           ========================================================= */

        "use strict";


        /* =========================================================
           DOM REFERENCES
           ========================================================= */

        const app = document.getElementById("app");

        const particlesContainer =
            document.getElementById("particles");

        const authScreen =
            document.getElementById("authScreen");

        const gameScreen =
            document.getElementById("gameScreen");

        const playerNameInput =
            document.getElementById("playerName");

        const startButton =
            document.getElementById("startButton");

        const dangerButton =
            document.getElementById("dangerButton");

        const dangerZone =
            document.getElementById("dangerZone");

        const scoreElement =
            document.getElementById("score");

        const comboElement =
            document.getElementById("combo");

        const failuresElement =
            document.getElementById("failures");

        const bestScoreElement =
            document.getElementById("bestScore");

        const stageLabelElement =
            document.getElementById("stageLabel");

        const gameTitleElement =
            document.getElementById("gameTitle");

        const progressFill =
            document.getElementById("progressFill");

        const progressText =
            document.getElementById("progressText");

        const feedbackElement =
            document.getElementById("feedback");

        const soundButton =
            document.getElementById("soundButton");

        const vibrationButton =
            document.getElementById("vibrationButton");

        const restartButton =
            document.getElementById("restartButton");

        const stageBanner =
            document.getElementById("stageBanner");

        const bannerSmall =
            document.getElementById("bannerSmall");

        const bannerTitle =
            document.getElementById("bannerTitle");

        const celebration =
            document.getElementById("celebration");


        /* =========================================================
           GAME SETTINGS
           ========================================================= */

        const STORAGE_KEYS = {
            bestScore: "sisyphusBestScore",
            settings: "sisyphusSettings",
            playerName: "sisyphusPlayerName"
        };


        /*
         * Each stage has:
         *
         * threshold:
         * How many successful presses are required.
         *
         * baselineChance:
         * Starting chance of failure.
         *
         * curveScale:
         * How quickly failure chance increases.
         */

        const STAGES = [
            {
                number: 1,
                threshold: 45,
                baselineChance: 0.10,
                curveScale: 0.12,
                title: "TALLY ZONE",
                label: "TALLY ZONE ARCHETYPE A"
            },

            {
                number: 2,
                threshold: 90,
                baselineChance: 0.12,
                curveScale: 0.20,
                title: "PRESSURE BUILD",
                label: "PRESSURE MATRIX B"
            },

            {
                number: 3,
                threshold: 160,
                baselineChance: 0.14,
                curveScale: 0.28,
                title: "FOCUS COLLAPSE",
                label: "FOCUS COLLAPSE PROTOCOL"
            },

            {
                number: 4,
                threshold: 240,
                baselineChance: 0.16,
                curveScale: 0.38,
                title: "CLINICAL PURGE",
                label: "CLINICAL PURGE PARADIGM"
            },

            {
                number: 5,
                threshold: 350,
                baselineChance: 0.18,
                curveScale: 0.48,
                title: "SISYPHUS MATRIX",
                label: "SISYPHUS MATRIX FAILURE"
            }
        ];


        /* =========================================================
           GAME STATE
           ========================================================= */

        let score = 0;
        let stage = 1;
        let stageProgress = 0;

        let combo = 0;
        let failures = 0;

        let gameRunning = false;
        let actionLocked = false;

        let soundEnabled = true;
        let vibrationEnabled = true;

        let audioContext = null;

        let bestScore =
            Number(
                localStorage.getItem(
                    STORAGE_KEYS.bestScore
                )
            ) || 0;


        /* =========================================================
           EFFECT COLOURS
           ========================================================= */

        const EFFECT_COLORS = [
            "#00ff88",
            "#00c8ff",
            "#b44cff",
            "#ffe600",
            "#ff8a00",
            "#ff4fd8"
        ];


        /* =========================================================
           RANDOM HELPERS
           ========================================================= */

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }


        function randomItem(array) {
            return array[
                Math.floor(Math.random() * array.length)
            ];
        }


        /* =========================================================
           AUDIO SYSTEM
           ========================================================= */

        function setupAudio() {
            if (audioContext) {
                return;
            }

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                return;
            }

            audioContext = new AudioContext();
        }


        function playTone(
            frequency,
            duration = 0.08,
            type = "sine",
            volume = 0.04
        ) {
            if (!soundEnabled) {
                return;
            }

            setupAudio();

            if (!audioContext) {
                return;
            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = type;
            oscillator.frequency.value = frequency;

            gain.gain.setValueAtTime(
                volume,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + duration
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + duration
            );
        }


        function playSuccessSound() {
            playTone(520, 0.07, "sine", 0.035);

            setTimeout(() => {
                playTone(760, 0.09, "sine", 0.025);
            }, 35);
        }


        function playComboSound(comboNumber) {
            const base =
                450 + Math.min(comboNumber, 20) * 25;

            playTone(base, 0.08, "triangle", 0.045);

            setTimeout(() => {
                playTone(
                    base + 180,
                    0.12,
                    "triangle",
                    0.035
                );
            }, 45);
        }


        function playFailureSound() {
            playTone(110, 0.18, "sawtooth", 0.06);

            setTimeout(() => {
                playTone(70, 0.2, "square", 0.035);
            }, 80);
        }


        function playStageSound() {
            const notes = [
                440,
                554,
                659,
                880
            ];

            notes.forEach((note, index) => {
                setTimeout(() => {
                    playTone(
                        note,
                        0.16,
                        "sine",
                        0.05
                    );
                }, index * 100);
            });
        }


        /* =========================================================
           VIBRATION SYSTEM
           ========================================================= */

        function vibrate(pattern) {
            if (!vibrationEnabled) {
                return;
            }

            if (
                "vibrate" in navigator &&
                typeof navigator.vibrate === "function"
            ) {
                try {
                    navigator.vibrate(pattern);
                } catch (error) {
                    /*
                     * Some browsers simply refuse vibration.
                     * That is okay — the visual effects still work.
                     */
                }
            }
        }


        function successVibration(comboNumber) {
            if (comboNumber >= 15) {
                vibrate([25, 30, 25, 30, 50]);
            } else if (comboNumber >= 10) {
                vibrate([20, 25, 40]);
            } else if (comboNumber >= 5) {
                vibrate([15, 20, 25]);
            } else {
                vibrate(12);
            }
        }


        function failureVibration() {
            vibrate([
                60,
                35,
                80,
                35,
                100
            ]);
        }


        function stageVibration() {
            vibrate([
                30,
                40,
                30,
                40,
                70
            ]);
        }


        /* =========================================================
           DISPLAY UPDATE
           ========================================================= */

        function updateDisplay() {
            scoreElement.textContent = score;
            comboElement.textContent = `${combo}×`;
            failuresElement.textContent = failures;

            bestScoreElement.textContent =
                Math.max(bestScore, score);

            const currentStage =
                STAGES[stage - 1];

            const percentage =
                Math.min(
                    100,
                    (stageProgress /
                        currentStage.threshold) *
                        100
                );

            progressFill.style.width =
                `${percentage}%`;

            progressText.textContent =
                `${Math.floor(percentage)}%`;

            stageLabelElement.textContent =
                `STAGE ${String(stage).padStart(2, "0")}`;

            gameTitleElement.textContent =
                currentStage.title;
        }


        /* =========================================================
           FEEDBACK
           ========================================================= */

        function showFeedback(
            message,
            type = ""
        ) {
            feedbackElement.textContent = message;

            feedbackElement.className =
                "feedback";

            if (type) {
                feedbackElement.classList.add(type);
            }
        }


        /* =========================================================
           SCORE ANIMATION
           ========================================================= */

        function animateScore() {
            scoreElement.classList.remove("bump");

            /*
             * Force browser reflow so the animation can
             * run again every time.
             */

            void scoreElement.offsetWidth;

            scoreElement.classList.add("bump");
        }


        /* =========================================================
           RIPPLE EFFECT
           ========================================================= */

        function createRipple(event) {
            const rect =
                dangerButton.getBoundingClientRect();

            let x;
            let y;

            if (
                event &&
                typeof event.clientX === "number"
            ) {
                x =
                    event.clientX -
                    rect.left;

                y =
                    event.clientY -
                    rect.top;
            } else {
                x = rect.width / 2;
                y = rect.height / 2;
            }

            const ripple =
                document.createElement("span");

            ripple.className = "ripple";

            ripple.style.left =
                `${x}px`;

            ripple.style.top =
                `${y}px`;

            ripple.style.color =
                randomItem(EFFECT_COLORS);

            dangerButton.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 700);
        }


        /* =========================================================
           PARTICLE EXPLOSION
           ========================================================= */

        function createParticleBurst(
            x,
            y,
            amount = 18,
            colors = EFFECT_COLORS
        ) {
            for (let i = 0; i < amount; i++) {

                const particle =
                    document.createElement("span");

                particle.className =
                    "effect-particle";

                const angle =
                    random(0, Math.PI * 2);

                const distance =
                    random(50, 170);

                const px =
                    Math.cos(angle) *
                    distance;

                const py =
                    Math.sin(angle) *
                    distance;

                particle.style.left =
                    `${x}px`;

                particle.style.top =
                    `${y}px`;

                particle.style.color =
                    randomItem(colors);

                particle.style.backgroundColor =
                    "currentColor";

                particle.style.setProperty(
                    "--x",
                    `${px}px`
                );

                particle.style.setProperty(
                    "--y",
                    `${py}px`
                );

                particle.style.setProperty(
                    "--duration",
                    `${random(450, 900)}ms`
                );

                document.body.appendChild(
                    particle
                );

                setTimeout(() => {
                    particle.remove();
                }, 950);
            }
        }


        /* =========================================================
           RING EFFECT
           ========================================================= */

        function createRing(
            x,
            y,
            color
        ) {
            const ring =
                document.createElement("div");

            ring.className =
                "effect-ring";

            ring.style.left =
                `${x}px`;

            ring.style.top =
                `${y}px`;

            ring.style.color =
                color;

            document.body.appendChild(
                ring
            );

            setTimeout(() => {
                ring.remove();
            }, 750);
        }


        /* =========================================================
           COMBO STARS
           ========================================================= */

        function createComboStars(
            x,
            y,
            amount = 6
        ) {
            for (let i = 0; i < amount; i++) {

                const star =
                    document.createElement("div");

                star.className =
                    "combo-star";

                star.textContent =
                    randomItem([
                        "✦",
                        "✧",
                        "★",
                        "◆"
                    ]);

                star.style.left =
                    `${x}px`;

                star.style.top =
                    `${y}px`;

                star.style.color =
                    randomItem([
                        "#ffe600",
                        "#ff8a00",
                        "#ff4fd8",
                        "#00c8ff"
                    ]);

                const angle =
                    random(0, Math.PI * 2);

                const distance =
                    random(80, 190);

                star.style.setProperty(
                    "--x",
                    `${Math.cos(angle) * distance}px`
                );

                star.style.setProperty(
                    "--y",
                    `${Math.sin(angle) * distance}px`
                );

                document.body.appendChild(
                    star
                );

                setTimeout(() => {
                    star.remove();
                }, 1000);
            }
        }


        /* =========================================================
           SCREEN FLASH
           ========================================================= */

        function screenFlash(type) {
            const flash =
                document.createElement("div");

            flash.className =
                `screen-flash ${type}`;

            document.body.appendChild(
                flash
            );

            setTimeout(() => {
                flash.remove();
            }, 500);
        }


        /* =========================================================
           FAILURE EFFECT
           ========================================================= */

        function failureEffect(x, y) {

            screenFlash("red");

            app.classList.remove("shake");

            void app.offsetWidth;

            app.classList.add("shake");

            createParticleBurst(
                x,
                y,
                30,
                [
                    "#ff3158",
                    "#ff1744",
                    "#ff6b81",
                    "#ff003c"
                ]
            );

            createRing(
                x,
                y,
                "#ff3158"
            );

            playFailureSound();

            failureVibration();
        }


        /* =========================================================
           SUCCESS EFFECT
           ========================================================= */

        function successEffect(
            x,
            y
        ) {

            const comboColor =
                combo >= 15
                    ? "#ff4fd8"
                    : combo >= 10
                        ? "#ff8a00"
                        : combo >= 5
                            ? "#ffe600"
                            : randomItem(
                                EFFECT_COLORS
                            );

            createParticleBurst(
                x,
                y,
                combo >= 15
                    ? 45
                    : combo >= 10
                        ? 32
                        : combo >= 5
                            ? 25
                            : 18,
                [
                    comboColor,
                    ...EFFECT_COLORS
                ]
            );

            createRing(
                x,
                y,
                comboColor
            );

            if (combo >= 5) {
                createComboStars(
                    x,
                    y,
                    combo >= 15
                        ? 16
                        : combo >= 10
                            ? 11
                            : 7
                );
            }

            if (combo >= 15) {
                screenFlash("purple");
            } else if (combo >= 10) {
                screenFlash("yellow");
            } else if (combo >= 5) {
                screenFlash("blue");
            } else {
                screenFlash("green");
            }

            playSuccessSound();

            if (combo >= 5) {
                playComboSound(combo);
            }

            successVibration(combo);
        }


        /* =========================================================
           BACKGROUND PARTICLES
           ========================================================= */

        function createBackgroundParticle() {

            const particle =
                document.createElement("span");

            particle.className =
                "background-particle";

            particle.style.left =
                `${random(0, 100)}%`;

            particle.style.top =
                `${random(100, 115)}%`;

            particle.style.animationDuration =
                `${random(5, 10)}s`;

            particle.style.opacity =
                random(0.2, 0.7);

            particlesContainer.appendChild(
                particle
            );

            setTimeout(() => {
                particle.remove();
            }, 11000);
        }


        setInterval(
            createBackgroundParticle,
            450
        );


        /* =========================================================
           RESET / FAILURE CHANCE
           ========================================================= */

        function getFailureChance() {

            const currentStage =
                STAGES[stage - 1];

            /*
             * Failure chance gradually increases as
             * the player approaches the end of a stage.
             */

            const progressRatio =
                stageProgress /
                currentStage.threshold;

            const growth =
                progressRatio *
                currentStage.curveScale;

            return Math.min(
                0.72,
                currentStage.baselineChance +
                growth
            );
        }


        /* =========================================================
           STAGE COMPLETION
           ========================================================= */

        function completeStage() {

            playStageSound();
            stageVibration();

            createStageCelebration();

            if (stage >= STAGES.length) {

                completeMission();

                return;
            }

            stage++;

            stageProgress = 0;
            combo = 0;

            showStageBanner();

            updateDisplay();

            showFeedback(
                `Stage ${stage} initialized.`,
                "success"
            );
        }


        /* =========================================================
           STAGE BANNER
           ========================================================= */

        function showStageBanner() {

            bannerSmall.textContent =
                "NEXT STAGE";

            bannerTitle.textContent =
                `STAGE ${String(stage).padStart(2, "0")}`;

            stageBanner.classList.remove("show");

            void stageBanner.offsetWidth;

            stageBanner.classList.add("show");

            setTimeout(() => {
                stageBanner.classList.remove(
                    "show"
                );
            }, 1800);
        }


        /* =========================================================
           STAGE CELEBRATION
           ========================================================= */

        function createStageCelebration() {

            const colors = [
                "#00ff88",
                "#00c8ff",
                "#b44cff",
                "#ffe600",
                "#ff8a00",
                "#ff4fd8"
            ];

            const centerX =
                window.innerWidth / 2;

            const centerY =
                window.innerHeight / 2;

            createParticleBurst(
                centerX,
                centerY,
                70,
                colors
            );

            createRing(
                centerX,
                centerY,
                randomItem(colors)
            );

            screenFlash("green");
        }


        /* =========================================================
           FINAL MISSION
           ========================================================= */

        function completeMission() {

            gameRunning = false;

            dangerButton.classList.add(
                "disabled"
            );

            showFeedback(
                "MISSION COMPLETE — YOU CONQUERED THE MATRIX.",
                "success"
            );

            bannerSmall.textContent =
                "MISSION COMPLETE";

            bannerTitle.textContent =
                "SISYPHUS DEFEATED";

            stageBanner.classList.remove(
                "show"
            );

            void stageBanner.offsetWidth;

            stageBanner.classList.add(
                "show"
            );

            playStageSound();

            setTimeout(() => {
                createFinalCelebration();
            }, 300);

            setTimeout(() => {
                stageBanner.classList.remove(
                    "show"
                );
            }, 2200);
        }


        /* =========================================================
           FINAL FIREWORK / CONFETTI
           ========================================================= */

        function createFinalCelebration() {

            const colors = [
                "#00ff88",
                "#00c8ff",
                "#b44cff",
                "#ffe600",
                "#ff8a00",
                "#ff4fd8",
                "#ffffff"
            ];

            screenFlash("purple");

            for (let i = 0; i < 120; i++) {

                const piece =
                    document.createElement("span");

                piece.className =
                    "celebration-piece";

                piece.style.left =
                    `${random(0, 100)}%`;

                piece.style.background =
                    randomItem(colors);

                piece.style.transform =
                    `rotate(${random(0, 360)}deg)`;

                piece.style.animationDelay =
                    `${random(0, 1.5)}s`;

                piece.style.setProperty(
                    "--fall-time",
                    `${random(2, 5)}s`
                );

                celebration.appendChild(
                    piece
                );

                setTimeout(() => {
                    piece.remove();
                }, 6500);
            }

            createParticleBurst(
                window.innerWidth / 2,
                window.innerHeight / 2,
                120,
                colors
            );

            vibrate([
                50,
                50,
                80,
                50,
                120,
                50,
                150
            ]);
        }


        /* =========================================================
           MAIN GAME ACTION
           ========================================================= */

        function handleAction(event) {

            if (!gameRunning) {
                return;
            }

            if (actionLocked) {
                return;
            }

            actionLocked = true;

            setTimeout(() => {
                actionLocked = false;
            }, 120);


            /* -----------------------------------------
               Get exact touch/click position
               ----------------------------------------- */

            const rect =
                dangerButton.getBoundingClientRect();

            let x =
                rect.left +
                rect.width / 2;

            let y =
                rect.top +
                rect.height / 2;

            if (
                event &&
                typeof event.clientX === "number" &&
                typeof event.clientY === "number"
            ) {
                x = event.clientX;
                y = event.clientY;
            }


            /* -----------------------------------------
               Ripple happens for EVERY touch/click
               ----------------------------------------- */

            createRipple(event);


            /* -----------------------------------------
               Check if this attempt fails
               ----------------------------------------- */

            const failureChance =
                getFailureChance();

            const failed =
                Math.random() <
                failureChance;


            if (failed) {

                failures++;

                combo = 0;

                showFeedback(
                    "RESET — FOCUS BROKEN.",
                    "danger"
                );

                failureEffect(x, y);

                updateDisplay();

                return;
            }


            /* -----------------------------------------
               Successful press
               ----------------------------------------- */

            score++;
            stageProgress++;
            combo++;

            animateScore();

            successEffect(
                x,
                y
            );


            /* -----------------------------------------
               Combo messages
               ----------------------------------------- */

            if (combo >= 15) {

                showFeedback(
                    `LEGENDARY COMBO ${combo}×`,
                    "success"
                );

            } else if (combo >= 10) {

                showFeedback(
                    `CRITICAL COMBO ${combo}×`,
                    "success"
                );

            } else if (combo >= 5) {

                showFeedback(
                    `COMBO ${combo}× — KEEP GOING`,
                    "warning"
                );

            } else {

                showFeedback(
                    "GOOD. KEEP PUSHING.",
                    "success"
                );
            }


            /* -----------------------------------------
               Best score
               ----------------------------------------- */

            if (score > bestScore) {

                bestScore = score;

                localStorage.setItem(
                    STORAGE_KEYS.bestScore,
                    bestScore
                );
            }


            updateDisplay();


            /* -----------------------------------------
               Check stage completion
               ----------------------------------------- */

            const currentStage =
                STAGES[stage - 1];

            if (
                stageProgress >=
                currentStage.threshold
            ) {

                setTimeout(
                    completeStage,
                    180
                );
            }
        }


        /* =========================================================
           START GAME
           ========================================================= */

        function startGame() {

            setupAudio();

            const enteredName =
                playerNameInput.value.trim();

            const playerName =
                enteredName ||
                "Operator";

            localStorage.setItem(
                STORAGE_KEYS.playerName,
                playerName
            );

            score = 0;
            stage = 1;
            stageProgress = 0;
            combo = 0;
            failures = 0;

            gameRunning = true;
            actionLocked = false;

            authScreen.classList.remove(
                "active"
            );

            gameScreen.classList.add(
                "active"
            );

            dangerButton.classList.remove(
                "disabled"
            );

            showFeedback(
                `Welcome ${playerName}. Stay focused.`
            );

            updateDisplay();

            playTone(
                520,
                0.12,
                "sine",
                0.04
            );
        }


        /* =========================================================
           RESTART GAME
           ========================================================= */

        function restartGame() {

            gameRunning = false;

            score = 0;
            stage = 1;
            stageProgress = 0;
            combo = 0;
            failures = 0;

            actionLocked = false;

            dangerButton.classList.remove(
                "disabled"
            );

            updateDisplay();

            showFeedback(
                "SYSTEM RESET. BEGIN AGAIN."
            );

            setTimeout(() => {
                gameRunning = true;
            }, 300);
        }


        /* =========================================================
           SETTINGS
           ========================================================= */

        function updateSoundButton() {

            soundButton.textContent =
                soundEnabled
                    ? "🔊 SOUND ON"
                    : "🔇 SOUND OFF";
        }


        function updateVibrationButton() {

            vibrationButton.textContent =
                vibrationEnabled
                    ? "📳 VIBRATION ON"
                    : "📴 VIBRATION OFF";
        }


        function saveSettings() {

            localStorage.setItem(
                STORAGE_KEYS.settings,
                JSON.stringify({
                    soundEnabled,
                    vibrationEnabled
                })
            );
        }


        function loadSettings() {

            const saved =
                localStorage.getItem(
                    STORAGE_KEYS.settings
                );

            if (!saved) {
                return;
            }

            try {

                const settings =
                    JSON.parse(saved);

                if (
                    typeof settings.soundEnabled ===
                    "boolean"
                ) {
                    soundEnabled =
                        settings.soundEnabled;
                }

                if (
                    typeof settings.vibrationEnabled ===
                    "boolean"
                ) {
                    vibrationEnabled =
                        settings.vibrationEnabled;
                }

            } catch (error) {
                /*
                 * Ignore damaged local settings.
                 */
            }

            updateSoundButton();
            updateVibrationButton();
        }


        /* =========================================================
           EVENT LISTENERS
           ========================================================= */

        startButton.addEventListener(
            "click",
            startGame
        );


        /*
         * Pointer Events allow:
         *
         * - mouse
         * - touchscreen
         * - stylus
         * - trackpad
         *
         * to use the same game action.
         */

        dangerButton.addEventListener(
            "pointerdown",
            handleAction
        );


        soundButton.addEventListener(
            "click",
            () => {

                soundEnabled =
                    !soundEnabled;

                updateSoundButton();

                saveSettings();

                if (soundEnabled) {
                    setupAudio();

                    playTone(
                        700,
                        0.1,
                        "sine",
                        0.04
                    );
                }
            }
        );


        vibrationButton.addEventListener(
            "click",
            () => {

                vibrationEnabled =
                    !vibrationEnabled;

                updateVibrationButton();

                saveSettings();

                if (vibrationEnabled) {
                    vibrate(30);
                }
            }
        );


        restartButton.addEventListener(
            "click",
            restartGame
        );


        /* =========================================================
           SPACEBAR SUPPORT
           ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.code !== "Space"
                ) {
                    return;
                }

                if (
                    document.activeElement ===
                    playerNameInput
                ) {
                    return;
                }

                event.preventDefault();

                if (!gameRunning) {
                    return;
                }

                handleAction({
                    clientX:
                        window.innerWidth / 2,

                    clientY:
                        window.innerHeight / 2
                });
            }
        );


        /* =========================================================
           ENTER TO START
           ========================================================= */

        playerNameInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {
                    startGame();
                }
            }
        );


        /* =========================================================
           INITIAL LOAD
           ========================================================= */

        function initialize() {

            loadSettings();

            bestScoreElement.textContent =
                bestScore;

            const savedName =
                localStorage.getItem(
                    STORAGE_KEYS.playerName
                );

            if (savedName) {
                playerNameInput.value =
                    savedName;
            }

            updateDisplay();

            /*
             * Create a few initial background particles.
             */

            for (let i = 0; i < 12; i++) {
                setTimeout(
                    createBackgroundParticle,
                    i * 150
                );
            }
        }


        initialize();

    </script>

</body>
</html>
